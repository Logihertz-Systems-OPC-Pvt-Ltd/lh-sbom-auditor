[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-sbom-auditor"
version = "0.1.0"
description = "Supply-chain security CLI that parses package lockfiles, generates CycloneDX 1.5 JSON SBOMs, and audits dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Logihertz Systems OPC Pvt Ltd", email = "security@logihertz.com" },
]
keywords = ["sbom", "cyclonedx", "security", "supply-chain", "audit", "lockfile"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.5",
]

[project.scripts]
lh-sbom = "lh_sbom_auditor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_sbom_auditor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.bandit]
exclude_dirs = [".venv", "tests"]

