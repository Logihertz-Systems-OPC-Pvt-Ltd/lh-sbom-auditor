[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-sbom-auditor"
version = "0.1.0"
description = "Validates CycloneDX (v1.4–v1.6) and SPDX (v2.3) Software Bills of Materials for NTIA minimum elements, cryptographic component hashes, copyleft/restrictive license violations (GPL/AGPL), PURL syntax, and orphan dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
keywords = [
    "sbom",
    "cyclonedx",
    "spdx",
    "ntia-compliance",
    "license-compliance",
    "supply-chain-security",
    "logihertz",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.5",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-sbom-auditor"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-sbom-auditor"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-sbom-auditor#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-sbom-auditor/issues"

[project.scripts]
lh-sbom = "lh_sbom_auditor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_sbom_auditor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.bandit]
exclude_dirs = [".venv", "tests"]

